name: Bug report
description: Create a report to help us improve WarpNest
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open WarpNest
        2. Create bottle '...'
        3. Click 'Play'
    validations:
      required: true
  - type: textarea
    id: diagnostics-report
    attributes:
      label: Diagnostics Export
      description: Paste the JSON output from the Diagnostics tab (personal identifiers are already omitted).
    validations:
      required: false
