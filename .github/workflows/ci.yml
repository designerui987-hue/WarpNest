name: macOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

    - name: Verify Swift Toolchain
      run: swift --version

    - name: Build Core & App
      run: swift build -v

    - name: Run Test Suite
      run: swift test -v
